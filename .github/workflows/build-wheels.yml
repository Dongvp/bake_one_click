name: Build Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: Build on ${{ matrix.os }} (${{ matrix.cibw_arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cibw_arch: AMD64
          - os: macos-14
            cibw_arch: arm64
          - os: macos-13
            cibw_arch: x86_64
          - os: ubuntu-22.04
            cibw_arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_ARCHS: ${{ matrix.cibw_arch }}
          CIBW_BEFORE_BUILD: "pip install cython numpy"
          CIBW_BUILD_FRONTEND: "build"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.cibw_arch }}
          path: ./wheelhouse/*.whl