name: Build Wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: AMD64
          - os: macos-14
            arch: arm64
          - os: ubuntu-22.04
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "cython>=3.0.11" numpy setuptools wheel

      - name: Build wheel
        run: python setup_wheel.py bdist_wheel

      - name: List output
        shell: bash
        run: ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl